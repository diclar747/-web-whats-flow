# Configuración optimizada de Nginx para WhatsFlow
# Sirve archivos estáticos directamente y hace proxy a Node.js para APIs

upstream nodejs_backend {
    server 127.0.0.1:3002;
    keepalive 64;
}

server {
    listen 80;
    server_name web.whats-flow.com;
    
    # Logs
    access_log /var/log/nginx/whatsflow-access.log;
    error_log /var/log/nginx/whatsflow-error.log;
    
    # Aumentar límites para archivos grandes
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    
    # Compresión gzip para mejor rendimiento
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
    
    # Servir archivos estáticos directamente desde el build de React
    location / {
        root /var/www/web.whats-flow.com/src/client/build;
        try_files $uri $uri/ /index.html;
        
        # Cache para archivos estáticos con hash (JS, CSS)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # NO cachear HTML para que los cambios se vean inmediatamente
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }
    }
    
    # Proxy para todas las rutas de API
    location /api/ {
        proxy_pass http://nodejs_backend;
        proxy_http_version 1.1;
        
        # Headers necesarios
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts aumentados para operaciones largas
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # NO cachear APIs
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    
    # Proxy para Socket.IO
    location /socket.io/ {
        proxy_pass http://nodejs_backend;
        proxy_http_version 1.1;
        
        # Headers para WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Timeouts largos para conexiones WebSocket
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
    
    # Servir archivos subidos
    location /uploads/ {
        alias /var/www/web.whats-flow.com/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }
    
    location /media/ {
        alias /var/www/web.whats-flow.com/media/;
        expires 30d;
        add_header Cache-Control "public";
    }
}
