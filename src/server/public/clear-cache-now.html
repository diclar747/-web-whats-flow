<!DOCTYPE html>
<html>
<head>
    <title>Limpiar Cache WhatsFlow</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Limpiando caché...</h1>
    <p id="status">Por favor espera...</p>
    
    <script>
        // Limpiar TODO el localStorage
        localStorage.clear();
        
        // Limpiar sessionStorage
        sessionStorage.clear();
        
        // Limpiar cookies
        document.cookie.split(";").forEach(function(c) { 
            document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
        });
        
        // Limpiar IndexedDB si existe
        if ('indexedDB' in window) {
            indexedDB.databases().then(databases => {
                databases.forEach(db => {
                    indexedDB.deleteDatabase(db.name);
                });
            });
        }
        
        document.getElementById('status').innerHTML = 
            '<h2 style="color: green;">✅ Caché limpiado completamente</h2>' +
            '<p>Ahora cierra esta pestaña y abre WhatsFlow en una <strong>NUEVA PESTAÑA PRIVADA/INCÓGNITO</strong></p>' +
            '<ol>' +
            '<li>Presiona Ctrl+Shift+N (Chrome) o Ctrl+Shift+P (Firefox)</li>' +
            '<li>Abre WhatsFlow en esa ventana privada</li>' +
            '<li>Inicia sesión nuevamente</li>' +
            '</ol>';
        
        setTimeout(() => {
            alert('Caché limpiado. Cierra esta pestaña y abre WhatsFlow en modo INCÓGNITO.');
        }, 1000);
    </script>
</body>
</html>
