<!DOCTYPE html>
<html>
<head>
    <title>Limpiar Tema - WhatsFlow</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 { color: #333; margin-bottom: 20px; }
        p { color: #666; margin-bottom: 30px; line-height: 1.6; }
        button {
            background: #25D366;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        button:hover {
            background: #1DA851;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
        }
        .success {
            display: none;
            color: #25D366;
            font-weight: 600;
            margin-top: 20px;
        }
        .info {
            background: #E3F2FD;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 14px;
            color: #1976D2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 Limpiar Tema WhatsFlow</h1>
        <p>
            Esto eliminará las configuraciones de tema guardadas en tu navegador 
            y establecerá el modo claro por defecto.
        </p>
        
        <button onclick="clearTheme()">
            ✨ Limpiar y Aplicar Modo Claro
        </button>
        
        <div class="success" id="success">
            ✅ ¡Tema limpiado exitosamente!<br>
            Redirigiendo al dashboard...
        </div>
        
        <div class="info">
            <strong>Configuraciones que se limpiarán:</strong><br>
            • whatsflow-theme<br>
            • whatsflow-chat-darkmode<br>
            • Caché del navegador
        </div>
    </div>
    
    <script>
        function clearTheme() {
            // Limpiar localStorage
            localStorage.removeItem('whatsflow-theme');
            localStorage.removeItem('whatsflow-chat-darkmode');
            
            // Establecer modo claro explícitamente
            localStorage.setItem('whatsflow-theme', 'light');
            localStorage.setItem('whatsflow-chat-darkmode', 'false');
            
            // Mostrar mensaje de éxito
            document.querySelector('button').style.display = 'none';
            document.getElementById('success').style.display = 'block';
            
            // Redirigir después de 2 segundos
            setTimeout(() => {
                window.location.href = '/dashboard/chat';
            }, 2000);
        }
    </script>
</body>
</html>
