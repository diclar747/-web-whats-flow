<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="winsapUltraGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00d2ff" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>
    </defs>
    
    <!-- Diseño con transparencia, inclinado más a la IZQUIERDA (-25 grados) -->
    <rect x="140" y="160" width="65" height="190" rx="32.5" fill="url(#winsapUltraGradient)" transform="rotate(-25, 172.5, 350)" />
    <rect x="246" y="190" width="65" height="140" rx="32.5" fill="url(#winsapUltraGradient)" transform="rotate(-25, 278.5, 330)" />
    <rect x="352" y="160" width="65" height="190" rx="32.5" fill="url(#winsapUltraGradient)" transform="rotate(-25, 384.5, 350)" />
    
    <!-- Curva inferior (Sonrisa) más pronunciada -->
    <path d="M150 420 Q 256 480, 362 420" fill="none" stroke="url(#winsapUltraGradient)" stroke-width="15" stroke-linecap="round" opacity="0.9" />
</svg>
